[package]
name = "utfsearch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compact path catalog: interned components, trigrams, newest-first search"

[features]
default = []
watch = []
usn = []

[dependencies]
csv = "1.3"
globset = "0.4"
jwalk = "0.8"
lru = "0.12"
memmap2 = "0.9"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
